name: Docs external links

on:
  schedule:
    # First day of each month, 03:00 UTC. External links rot on their own
    # schedule; checking per-PR would block contributors on other people's
    # outages.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,403,429
            --max-retries 3
            --exclude-loopback
            "website/docs/**/*.{md,mdx}"
          fail: false
      - name: Open an issue on failures
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Broken external links in docs"
          content-filepath: ./lychee/out.md
          labels: documentation
