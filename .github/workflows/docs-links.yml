name: Docs external links

on:
  schedule:
    # First day of each month, 03:00 UTC. External links rot on their own
    # schedule; checking per-PR would block contributors on other people's
    # outages.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A broken link fails the run, which notifies the maintainer, and the
      # run's job summary lists the links. The workflow does not open issues.
      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee does not expand braces such as *.{md,mdx}, so each
          # extension needs its own glob.
          args: >-
            --no-progress
            --accept 200,403,429
            --max-retries 3
            --exclude-loopback
            "website/docs/**/*.md"
            "website/docs/**/*.mdx"
          fail: true
