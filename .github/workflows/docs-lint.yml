name: Docs lint

on:
  pull_request:
    paths:
      - "website/**"

permissions:
  contents: read

jobs:
  vale:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Vale runs advisory (never fails the build); findings appear in the log.
      # Styles are local to styles/kroger, so no package sync is needed.
      - name: Vale prose lint (advisory)
        working-directory: website
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v3.20.0/vale_3.20.0_Linux_64-bit.tar.gz" -o /tmp/vale.tgz
          tar -xzf /tmp/vale.tgz -C /tmp vale
          /tmp/vale docs/ || true

  prettier:
    name: Prettier format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check formatting
        working-directory: website
        run: npx --yes prettier --check "docs/**/*.{md,mdx}" "*.js" "styles/**/*.yml" "src/**/*.{js,css}"
