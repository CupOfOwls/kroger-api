name: Docs lint

on:
  pull_request:
    paths:
      - "website/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vale runs advisory (never fails the build); findings appear in the log.
      # Styles are local to styles/kroger, so no package sync is needed.
      - name: Vale prose lint (advisory)
        working-directory: website
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v3.20.0/vale_3.20.0_Linux_64-bit.tar.gz" -o /tmp/vale.tgz
          tar -xzf /tmp/vale.tgz -C /tmp vale
          /tmp/vale docs/ || true

  prettier:
    name: Prettier format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        working-directory: website
        run: npx --yes prettier --check "docs/**/*.{md,mdx}" "*.js" "styles/**/*.yml" "src/**/*.{js,css}"
